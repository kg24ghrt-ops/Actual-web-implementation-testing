<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f8f9fa" />
  <meta name="description" content="Photorealistic lined notebook paper with DIN 476 A4 dimensions. Pinch to zoom, drag to pan, type on lines." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Notebook Paper</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Rough.js for handwritten text rendering -->
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.5.2/bundled/rough.cjs.js"></script>
  
  <!-- Google Fonts - Handwritten fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Photorealistic Notebook Paper CSS Library - Downloaded by CI from GitHub releases -->
  <link rel="stylesheet" href="css/lib/notebook-paper.min.css" />
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Inline critical CSS for faster loading -->
  <style>
    @tailwind base;
    @tailwind components;
    @tailwind utilities;
    
    /* Custom animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(10px); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .animate-fade-out { animation: fadeOut 0.3s ease-out; }
    .animate-spin { animation: spin 1s linear infinite; }
    
    /* Prevent overscroll on iOS */
    html, body { 
      overscroll-behavior: none; 
      -webkit-overscroll-behavior: none; 
    }
    
    /* Smooth scrolling */
    html { 
      scroll-behavior: smooth; 
    }
    
    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar { 
      width: 8px; 
      height: 8px; 
    }
    ::-webkit-scrollbar-track { 
      background: transparent; 
    }
    ::-webkit-scrollbar-thumb { 
      background: #888; 
      border-radius: 4px; 
    }
    ::-webkit-scrollbar-thumb:hover { 
      background: #555; 
    }
    
    /* Handwritten font classes */
    .font-caveat { font-family: 'Caveat', cursive; }
    .font-dancing { font-family: 'Dancing Script', cursive; }
    
    /* Override notebook-paper-css to work with our zoom/pan system */
    #paper.notebook-paper {
      position: relative;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: top left;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    
    /* Ensure paper container handles the transform */
    #paperContainer {
      transform-origin: 0 0;
    }
    
    /* Paper content - clean, empty by default */
    #paperContent {
      pointer-events: none;
    }
  </style>
  
  <!-- Preconnect to CDNs for faster loading -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
</head>

<body class="h-full overflow-hidden bg-zinc-100 select-none transition-colors duration-300">

  <!-- Loading Indicator -->
  <div id="loadingIndicator" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 transition-opacity duration-300">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white"></div>
  </div>

  <!-- Toolbar -->
  <header class="fixed inset-x-0 top-0 z-50 flex items-center gap-3 px-4 h-14 bg-zinc-900 shadow-lg transition-all duration-300">
    <!-- Logo / App Name -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 flex items-center justify-center rounded bg-emerald-600 text-white font-bold text-lg">
        N
      </div>
      <div class="hidden sm:block">
        <h1 class="text-sm font-semibold text-zinc-200 tracking-tight">Notebook</h1>
      </div>
    </div>

    <!-- Format Selector -->
    <div class="flex items-center gap-2 ml-4">
      <label class="sr-only" for="formatSelect">Paper format</label>
      <select id="formatSelect"
        class="bg-zinc-800 text-zinc-200 text-xs font-semibold border border-zinc-600 rounded px-3 py-1.5 outline-none focus:ring-2 focus:ring-emerald-500 transition-all duration-200 hover:bg-zinc-700">
        <option value="A4" selected>A4</option>
        <option value="A5">A5</option>
      </select>
    </div>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Zoom Controls -->
    <div class="flex items-center gap-1">
      <button id="zoomOut"
        class="w-8 h-8 flex items-center justify-center rounded bg-zinc-800 text-zinc-300 border border-zinc-600 text-base font-bold active:bg-zinc-600 transition hover:bg-zinc-700"
        title="Zoom out (-)">&minus;</button>
      <span id="zoomLabel"
        class="min-w-[52px] text-right text-xs font-mono text-zinc-400 tabular-nums">100%</span>
      <button id="zoomIn"
        class="w-8 h-8 flex items-center justify-center rounded bg-zinc-800 text-zinc-300 border border-zinc-600 text-base font-bold active:bg-zinc-600 transition hover:bg-zinc-700"
        title="Zoom in (+)">+</button>
    </div>

    <!-- Reset View -->
    <div class="flex items-center gap-1 ml-1">
      <button id="resetView"
        class="h-8 px-3 rounded bg-zinc-800 text-zinc-300 border border-zinc-600 text-xs font-semibold active:bg-zinc-600 transition hover:bg-zinc-700"
        title="Reset view (R)">Reset</button>
    </div>

    <!-- Handwriting Toggle -->
    <div class="flex items-center gap-1 ml-1">
      <button id="handwritingToggle"
        class="h-8 px-3 rounded bg-emerald-600 text-white border border-emerald-700 text-xs font-semibold active:bg-emerald-700 transition hover:bg-emerald-500"
        title="Toggle handwriting mode">Write</button>
    </div>
  </header>

  <!-- Viewport (pan / pinch area) -->
  <main id="viewport"
    class="absolute top-14 inset-x-0 bottom-0 overflow-hidden cursor-grab touch-none"
    style="background: #f8f9fa;">

    <!-- GPU-composited paper container -->
    <div id="paperContainer"
      class="absolute origin-top-left will-change-transform"
      style="backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin: 0 0;">

      <!-- The paper surface - Uses notebook-paper-css for photorealistic appearance -->
      <div id="paper" class="notebook-paper a4 texture paper-a4" style="width: 793.7px; height: 1122.5px;">

        <!-- Handwritten text canvas (positioned above paper) -->
        <canvas id="handwritingCanvas" class="absolute inset-0 pointer-events-auto z-[10]" style="touch-action: none;"></canvas>

        <!-- Content area - EMPTY by default, no text -->
        <div id="paperContent"
          class="relative z-[5]"
          style="padding-top: 113.4px; padding-left: 94.5px; padding-right: 32px; padding-bottom: 48px;">
        </div>

        <!-- Paper edge shadows (depth cues) -->
        <div class="absolute top-0 inset-x-0 h-[2px] z-[4] pointer-events-none" style="background: linear-gradient(180deg, rgba(0,0,0,.06), transparent);"></div>
        <div class="absolute top-0 left-0 bottom-0 w-[2px] z-[4] pointer-events-none" style="background: linear-gradient(90deg, rgba(0,0,0,.04), transparent);"></div>
        <div class="absolute top-0 right-0 bottom-0 w-[3px] z-[4] pointer-events-none" style="background: linear-gradient(270deg, rgba(0,0,0,.08), transparent);"></div>
        <div class="absolute bottom-0 inset-x-0 h-[4px] z-[4] pointer-events-none" style="background: linear-gradient(0deg, rgba(0,0,0,.10), transparent);"></div>
      </div>

    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="paper.js"></script>
  <script src="app.js"></script>
  <script src="handwriting.js"></script>
  
  <!-- Initialize -->
  <script>
    (function() {
      'use strict';
      
      // Theme toggle functionality
      const themeToggle = document.getElementById('themeToggle');
      const handwritingToggle = document.getElementById('handwritingToggle');
      
      if (themeToggle) {
        themeToggle.addEventListener('click', function() {
          if (window.NoHomeWorkApp && window.NoHomeWorkApp.theme) {
            window.NoHomeWorkApp.theme.toggle();
          }
        });
      }
      
      if (handwritingToggle) {
        handwritingToggle.addEventListener('click', function() {
          if (window.Handwriting && typeof window.Handwriting.toggle === 'function') {
            window.Handwriting.toggle();
          }
        });
      }
      
      // Hide loading indicator when Paper.js is ready
      const checkReady = setInterval(function() {
        if (document.documentElement.dataset.ready === 'true') {
          clearInterval(checkReady);
          const loading = document.getElementById('loadingIndicator');
          if (loading) {
            loading.style.opacity = '0';
            setTimeout(() => loading.remove(), 300);
          }
        }
      }, 100);
    })();
  </script>
</body>
</html>
