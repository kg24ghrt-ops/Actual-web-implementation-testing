plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.opt.nohomework"
    compileSdk 35
    
    signingConfigs {
        release {
            storeFile file(rootProject.projectDir.absolutePath + "/release.keystore")
            storePassword System.getenv("STORE_PASSWORD") ?: "changeit"
            keyAlias System.getenv("KEY_ALIAS") ?: "release"
            keyPassword System.getenv("KEY_PASSWORD") ?: "changeit"
        }
    }
    
    defaultConfig {
        applicationId "com.opt.nohomework"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "3.0.0"
        
        // Enable vector drawables
        vectorDrawables.useSupportLibrary = true
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Enable hardware acceleration debugging
            debuggable true
            jniDebuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
        // Enable all Kotlin features
        freeCompilerArgs += ["-Xjsr305=strict"]
    }
    
    buildFeatures {
        // Enable Compose if we add it later
        compose false
        viewBinding false
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    
    // Material 3 - Latest stable
    implementation 'com.google.android.material:material:1.12.0'
    
    // ConstraintLayout for complex layouts
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    
    // For edge-to-edge support
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
