name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --build-cache --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass changeit \
            -alias release \
            -keypass changeit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android, OU=Android, O=NoHomeWork, L=Unknown, S=Unknown, C=US"

      - name: Build Release
        run: |
          chmod +x gradlew
          STORE_PASSWORD=changeit KEY_ALIAS=release KEY_PASSWORD=changeit \
          ./gradlew assembleRelease --parallel --build-cache --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7
