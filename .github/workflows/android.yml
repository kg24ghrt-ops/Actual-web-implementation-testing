name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    name: Web Assets (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Validate web assets
        run: bun run validate

      - name: Lint web assets
        run: bun run lint

      - name: Build web assets
        run: bun run build

      - name: Test web assets
        run: bun run test

  debug:
    name: Debug APK
    needs: web-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --build-cache --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release APK
    needs: web-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Signing Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Release
        run: |
          chmod +x gradlew
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }} \
          KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
          ./gradlew assembleRelease --parallel --build-cache --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7