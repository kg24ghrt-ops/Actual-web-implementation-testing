name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate Gradle Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x gradlew

      - name: Commit Gradle Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew gradlew.bat gradle/wrapper/

          if git diff --cached --quiet; then
            echo "Gradle wrapper already up to date."
          else
            git commit -m "ci: add Gradle wrapper"
            git push
          fi

  debug:
    name: Debug APK
    needs: bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --build-cache --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release APK
    needs: bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --build-cache --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7