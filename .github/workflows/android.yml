name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# Don't waste runner time building obsolete runs.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --parallel --build-cache --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: "**/build/outputs/apk/**/*.apk"

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleRelease --parallel --build-cache --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: "**/build/outputs/apk/**/*.apk"