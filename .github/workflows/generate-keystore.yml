name: Generate Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass changeit \
            -alias release \
            -keypass changeit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=no home work, OU=No Home Work, O=NoHomeWork, L=Unknown, S=Unknown, C=US"

      - name: Upload Keystore
        uses: actions/upload-artifact@v7
        with:
          name: signing-keystore
          path: release.keystore
          retention-days: 7